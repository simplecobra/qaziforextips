<style>
/* Layout: one-screen phone app — sticky brand header, scrolling view, fixed 5-tab bottom bar. Midnight Gold brand (same as qaziforextips.com). */
:root{
  --bg:#0d1220; --bg2:#111829; --surface:#151d30; --surface2:#1b2540; --line:#26304a;
  --ink:#eef1f7; --muted:#9aa4ba;
  --gold:#e7b94f; --gold-ink:#1c1405; --gold-soft:rgba(231,185,79,.14);
  --wine:#c23b55; --wine-soft:rgba(194,59,85,.16);
  --up:#3fbf8a; --warn:#e9a23b; --down:#e2556b; --hol:#7d8aa8;
  --f-display:"Saira Condensed","Saira FB","Saira FBR","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Source FB","Source FBR","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;
  --r:12px; --nav-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5f3ee; --bg2:#ece8e0; --surface:#ffffff; --surface2:#f7f4ee; --line:#ddd6ca;
  --ink:#161a26; --muted:#5b6274; --gold:#b98418; --gold-ink:#1c1405; --gold-soft:rgba(185,132,24,.12);
  --wine:#a8233f; --wine-soft:rgba(168,35,63,.10); --up:#1d8f60; --warn:#b8730f; --down:#c0344c; --hol:#6b7590;
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f5f3ee; --bg2:#ece8e0; --surface:#ffffff; --surface2:#f7f4ee; --line:#ddd6ca;
  --ink:#161a26; --muted:#5b6274; --gold:#b98418; --gold-ink:#1c1405; --gold-soft:rgba(185,132,24,.12);
  --wine:#a8233f; --wine-soft:rgba(168,35,63,.10); --up:#1d8f60; --warn:#b8730f; --down:#c0344c; --hol:#6b7590;
  color-scheme:light; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body.ur{font-family:var(--f-ur),var(--f-body);font-size:15px;line-height:2.05}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[dir="ltr"]{direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.top img{width:38px;height:38px;border-radius:9px;background:#0b0f1a}
.brand{flex:1;min-width:0;line-height:1.1}
.brand b{display:block;font-family:var(--f-display);font-size:21px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted)}
body.ur .brand span{font-family:var(--f-ur)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{border-color:var(--gold)}

main{max-width:760px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:18px}
h2{font-family:var(--f-display);font-size:26px;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
body.ur h2{font-family:var(--f-ur);font-size:21px;line-height:1.9}
h3{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:.02em}
body.ur h3{font-family:var(--f-ur);font-size:17px;line-height:1.9}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700}
body.ur .eyebrow{letter-spacing:0;text-transform:none;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;border:1px solid transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* home hero: next news */
.next{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--wine-soft),transparent 70%);pointer-events:none}
body[dir="rtl"] .next::after{inset:auto auto -60px -40px}
.count{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:.02em;color:var(--gold);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.next-title{font-weight:700;font-size:18px;line-height:1.3}

/* sessions */
.sess{display:grid;gap:8px}
.sess-row{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--bg2);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--line)}
.bar i.on{background:var(--gold)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--wine)}
.sess-st{font-size:12px;font-weight:700;white-space:nowrap}
.sess-st.on{color:var(--up)}.sess-st.off{color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick button{display:grid;gap:4px;justify-items:start;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;min-width:0}
.quick button:hover{border-color:var(--gold)}
.quick b{font-size:14px;line-height:1.25}
.quick small{color:var(--muted);font-size:12px;line-height:1.3}
.qi{font-family:var(--f-mono);font-size:13px;color:var(--gold);font-weight:600}


/* calendar */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.day{display:grid;gap:8px}
.day-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:2;background:var(--bg);padding-block:6px;font-family:var(--f-display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
body.ur .day-h{font-family:var(--f-ur);text-transform:none;letter-spacing:0}
.ev{display:grid;grid-template-columns:54px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;border-inline-start:4px solid var(--hol);cursor:pointer;text-align:start;width:100%}
.ev.High{border-inline-start-color:var(--down)}.ev.Medium{border-inline-start-color:var(--warn)}.ev.Low{border-inline-start-color:var(--line)}
.ev.past{opacity:.55}
.ev-t{font-family:var(--f-mono);font-size:14px;font-weight:600;direction:ltr}
.ev-c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev-title{font-weight:600;line-height:1.3;direction:ltr;text-align:start}
.fp{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.fp span b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.note{margin-top:8px;padding:10px;border-radius:8px;background:var(--gold-soft);font-size:14px;line-height:1.45}
body.ur .note{line-height:2}
.banner{border:1px dashed var(--warn);color:var(--ink);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:10px;padding:10px 12px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* calculators */
.calc{display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:380px){.fields{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-family:var(--f-mono);font-size:16px;color:var(--ink);direction:ltr;min-width:0}
label.f select{font-family:var(--f-body)}
label.f input:focus,label.f select:focus{border-color:var(--gold);outline:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.result{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.big{font-family:var(--f-mono);font-size:30px;font-weight:600;color:var(--gold);line-height:1.1;direction:ltr;unicode-bidi:isolate}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.kv div{display:grid;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:15px;color:var(--ink);font-weight:600;direction:ltr;text-align:start}
.warn{border-radius:9px;padding:9px 11px;font-size:13px;font-weight:600;background:var(--wine-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--wine) 45%,transparent)}
.ok{border-radius:9px;padding:9px 11px;font-size:13px;background:color-mix(in srgb,var(--up) 12%,transparent);border:1px solid color-mix(in srgb,var(--up) 40%,transparent)}
.tip{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
table.t td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;max-height:280px}

/* videos */
.vlist{display:grid;gap:10px}
.vid{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.vid:hover{border-color:var(--gold)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--wine-soft),var(--surface2));display:grid;place-items:center;max-width:100%}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pl{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--gold-ink);font-size:12px}
.thumb .du{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.78);color:#fff;font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px}
.vid-t{font-size:14px;font-weight:600;line-height:1.3;direction:ltr;text-align:start;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vid-n{font-family:var(--f-mono);font-size:11px;color:var(--gold);font-weight:600}
details.pl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.pl-card summary{list-style:none;cursor:pointer;padding:14px;display:grid;gap:4px}
details.pl-card summary::-webkit-details-marker{display:none}
details.pl-card[open] summary{border-bottom:1px solid var(--line)}
details.pl-card .vlist{padding:10px}
details.pl-card .vid{background:var(--bg2)}

/* software */
.sw{display:grid;gap:10px}
.sw ul{margin:0;padding-inline-start:18px;display:grid;gap:2px;font-size:14px}
.sw img{border-radius:10px;border:1px solid var(--line);width:100%;max-width:100%}
.wa{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wa .num{font-size:16px;font-weight:600}

/* more */
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.about{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.about img{width:64px;height:64px;border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--bg2);border-radius:10px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gold);line-height:1}
.stats span{font-size:11px;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.disc{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.tabs button{border:0;background:transparent;display:grid;place-items:center;align-content:center;gap:3px;font-size:10.5px;min-width:0;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.02em}
body.ur .tabs button{font-size:11px;letter-spacing:0;line-height:1.5}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--gold)}
.tabs button[aria-current="page"] svg{stroke-width:2.2}
/* checklist */
.ck{display:grid;gap:8px}
.ck-i{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:start;width:100%}
.ck-i .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--gold-ink)}
.ck-i[aria-checked="true"]{border-color:color-mix(in srgb,var(--up) 50%,var(--line))}
.ck-i[aria-checked="true"] .box{background:var(--up);border-color:var(--up)}
.ck-i.auto{cursor:default}
.ck-i.bad{border-color:color-mix(in srgb,var(--down) 55%,var(--line))}
.ck-i.bad .box{background:var(--down);border-color:var(--down);color:#fff}
.ck-i b{font-size:14px;line-height:1.35;font-weight:600}
.ck-i small{display:block;color:var(--muted);font-size:12px;font-weight:400;line-height:1.35}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.verdict .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;letter-spacing:.03em}
.verdict.go{border-color:var(--up)} .verdict.go .v{color:var(--up)}
.verdict.wait{border-color:var(--warn)} .verdict.wait .v{color:var(--warn)}
.verdict.no{border-color:var(--down)} .verdict.no .v{color:var(--down)}
.meter{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}

/* journal */
.jstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jstats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;min-width:0}
.jstats span{font-size:11px;color:var(--muted);line-height:1.3}
.jstats b{font-family:var(--f-mono);font-size:18px;font-weight:600;direction:ltr;text-align:start}
.pos{color:var(--up)}.neg{color:var(--down)}
.curve{width:100%;height:120px;display:block}
.insight{display:grid;gap:6px;font-size:14px}
.insight p{margin:0;padding:9px 11px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
body.ur .insight p{line-height:2}
.trade{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.trade .r{font-family:var(--f-mono);font-weight:600;font-size:16px;direction:ltr}
.trade .meta{font-size:12px;color:var(--muted)}
.trade .sym{font-weight:700;font-size:14px}
.dir{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
.dir.buy{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.dir.sell{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.del.arm{border-color:var(--down);color:var(--down);font-weight:700}
.guard{display:grid;gap:6px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.guard.stop{border-color:var(--down);background:color-mix(in srgb,var(--down) 9%,var(--surface))}
.guard.care{border-color:var(--warn)}

/* quizzes */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qcard{display:grid;gap:6px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;min-width:0}
.qcard:hover{border-color:var(--gold)}
.qcard b{font-size:15px;line-height:1.3}
.qcard .sc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qcard .sc.pass{color:var(--up)}
.opt{display:block;width:100%;text-align:start;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:15px;line-height:1.4}
body.ur .opt{line-height:2}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.right{border-color:var(--up);background:color-mix(in srgb,var(--up) 14%,var(--bg2))}
.opt.wrong{border-color:var(--down);background:color-mix(in srgb,var(--down) 12%,var(--bg2))}
.opt[disabled]{cursor:default}
.prog{display:grid;gap:4px}
.vrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.seen{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;font-weight:700;color:var(--gold-ink)}
.seen[aria-pressed="true"]{background:var(--up);border-color:var(--up)}
@media (max-width:380px){.jstats{grid-template-columns:repeat(2,minmax(0,1fr))}.qgrid{grid-template-columns:1fr}}
/* v3: gold plan, level, toggles */
.plan{display:grid;gap:12px;border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:16px;padding:16px;background:linear-gradient(160deg,var(--gold-soft),var(--surface) 55%)}
.plan-h{margin:0;font-size:17px;font-weight:600;line-height:1.4}
body.ur .plan-h{line-height:2.1}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lvls.tall{grid-template-columns:1fr;gap:4px}
.lv{display:grid;justify-items:center;gap:1px;background:var(--bg2);border-radius:9px;padding:7px 4px;border-top:3px solid var(--line)}
.lvls.tall .lv{grid-template-columns:52px 1fr;justify-items:start;align-items:center;padding:8px 12px;border-top:0;border-left:3px solid var(--line)}
.lv span{font-size:11px;font-weight:700;color:var(--muted)}
.lv b{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.lvls.tall .lv b{font-size:17px}
.lv.r{border-color:var(--down)}.lv.s{border-color:var(--up)}.lv.p{border-color:var(--gold)}
.sc-box{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.flame{display:grid;justify-items:center;align-content:center;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--gold-soft),transparent 70%),var(--bg2);border:2px solid var(--gold)}
.flame b{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--gold)}
.flame span{font-size:10px;color:var(--muted);text-align:center;line-height:1.1}
.sw-t{width:46px;height:26px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);position:relative;cursor:pointer;flex:none}
.sw-t i{position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:inset-inline-start .15s}
.sw-t[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.sw-t[aria-pressed="true"] i{inset-inline-start:22px;background:var(--gold-ink)}
.li span{min-width:0;flex:1}
@media (max-width:380px){.lvls{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

const SESS=[{n:"Sydney",tz:"Australia/Sydney",o:7,c:16},{n:"Tokyo",tz:"Asia/Tokyo",o:9,c:18},{n:"London",tz:"Europe/London",o:8,c:17},{n:"New York",tz:"America/New_York",o:8,c:17}];
const fmtCache={};
function zp(d,tz){ const f=fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",hour:"2-digit",minute:"2-digit",weekday:"short"}));
  const p={}; f.formatToParts(d).forEach(x=>p[x.type]=x.value); return {h:+p.hour%24,m:+p.minute,wd:p.weekday}; }
function fxOpen(d){ const ny=zp(d,"America/New_York"); // week: Sun 17:00 – Fri 17:00 New York
  if(ny.wd==="Sat") return false; if(ny.wd==="Sun") return ny.h>=17; if(ny.wd==="Fri") return ny.h<17; return true; }
function sessOpen(s,d){ if(!fxOpen(d)) return false; const z=zp(d,s.tz); const wd=z.wd; if(wd==="Sat"||wd==="Sun") return false; return z.h>=s.o && z.h<s.c; }
function nextFlip(fn,d){ const st=fn(d); for(let i=1;i<=900;i++){ const x=new Date(d.getTime()+i*5*60000); if(fn(x)!==st) return x; } return null; }
function dur(ms){ const m=Math.max(0,Math.round(ms/60000)); const h=Math.floor(m/60); return h>0? `${h}h ${String(m%60).padStart(2,"0")}m` : `${m}m`; }
function localHourOf(s,hour){ // where the session's open/close hour falls on today's 24h strip of the phone
  const now=new Date(); const base=new Date(now); base.setHours(0,0,0,0);
  for(let i=0;i<288;i++){ const x=new Date(base.getTime()+i*5*60000); const z=zp(x,s.tz); if(z.h===hour&&z.m<5) return i/12; } return null; }
function sessionsHTML(){ const now=new Date(); const nowH=now.getHours()+now.getMinutes()/60; const pct=h=>(h/24*100).toFixed(2);
  if(!fxOpen(now)){ const op=nextFlip(fxOpen,now); return `<div class="banner">${t("weekend")} ${op?`${t("opensIn")} <b class="mono" dir="ltr">${dur(op-now)}</b>`:""}</div>`; }
  const rows=SESS.map(s=>{ const on=sessOpen(s,now); const fl=nextFlip(d=>sessOpen(s,d),now);
    const a=localHourOf(s,s.o), b=localHourOf(s,s.c); let segs="";
    if(a!=null&&b!=null){ segs = a<b ? `<i class="${on?'on':''}" style="inset-inline-start:${pct(a)}%;width:${pct(b-a)}%"></i>`
      : `<i class="${on?'on':''}" style="inset-inline-start:${pct(a)}%;width:${pct(24-a)}%"></i><i class="${on?'on':''}" style="inset-inline-start:0;width:${pct(b)}%"></i>`; }
    return `<div class="sess-row"><b>${s.n}</b><div class="bar" aria-hidden="true">${segs}<b style="inset-inline-start:${pct(nowH)}%"></b></div>
      <span class="sess-st ${on?'on':'off'}">${on?t("open"):t("closed")} · ${on?t("closesIn"):t("opensIn")} <span dir="ltr">${fl?dur(fl-now):"—"}</span></span></div>`; }).join("");
  const lon=sessOpen(SESS[2],now), ny=sessOpen(SESS[3],now);
  return `<div class="sess">${rows}</div>${lon&&ny?`<div class="ok small">${t("overlap")}</div>`:""}<div class="small muted">${t("yourTime")} (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)})</div>`; }

/* ---------- calculators (pure math, testable) ---------- */
const CALC = {
 gold({bal,riskMode,risk,entry,sl,tp,contract}){
  const riskUsd = riskMode==="pct"? bal*risk/100 : risk; const dist=Math.abs(entry-sl);
  if(!(dist>0)) return {err:"w_sl"};
  const raw=riskUsd/(dist*contract); const lot=Math.floor(raw*100+1e-9)/100;
  const out={riskUsd,dist,lot,raw,actual:lot*dist*contract,dir:sl<entry?"buy":"sell",riskPct:bal>0?riskUsd/bal*100:NaN};
  if(tp>0){ const td=out.dir==="buy"? tp-entry : entry-tp; if(td<=0) out.tpErr=true; else {out.rr=td/dist; out.profit=lot*td*contract;} }
  return out; },
 pipValue(sym,rate){ // USD value of 1 pip for 1 standard lot (100,000)
  const q=sym.slice(3); if(q==="USD") return 10; if(q==="JPY") return 1000/rate; if(q==="GBP") return 10*rate; return 10/rate; },
 fx({bal,riskMode,risk,sym,slPips,rate}){
  const riskUsd = riskMode==="pct"? bal*risk/100 : risk; const pv=CALC.pipValue(sym,rate);
  if(!(slPips>0)||!(pv>0)) return {err:"w_sl"}; const raw=riskUsd/(slPips*pv); const lot=Math.floor(raw*100+1e-9)/100;
  return {riskUsd,pv,raw,lot,actual:lot*slPips*pv,riskPct:bal>0?riskUsd/bal*100:NaN}; },
 rr({entry,sl,tp}){ const r=Math.abs(entry-sl); if(!(r>0)) return {err:"w_sl"}; const dir=sl<entry?1:-1; const w=(tp-entry)*dir; if(!(w>0)) return {err:"w_side"};
  const rr=w/r; return {rr,be:100/(1+rr),risk:r,reward:w}; },
 margin({kind,lots,price,lev,contract}){ if(kind==="gold") return lots*contract*price/lev; if(kind==="usdq") return lots*100000*price/lev; if(kind==="usdb") return lots*100000/lev; return lots*100000*price/lev; },
 comp({start,pct,months}){ const rows=[]; let b=start; for(let i=1;i<=months;i++){ b*=1+pct/100; rows.push([i,b]); } return rows; },
 dd(l){ return l>=100? Infinity : (1/(1-l/100)-1)*100; }
};

  rr:{entry:4100,sl:4092,tp:4124},
  margin:{kind:"gold",lots:0.1,price:4100,lev:500,contract:100},
  comp:{start:1000,pct:5,months:12}, dd:{loss:20} }, store.get("calc",{}));
const RATE_FOR = q => ({JPY:"USD/JPY",CHF:"USD/CHF",CAD:"USD/CAD",GBP:"GBP/USD"}[q]);
const RATE_DEF = {JPY:150,CHF:0.80,CAD:1.38,GBP:1.33};
const SYMS=["EURUSD","GBPUSD","AUDUSD","NZDUSD","USDJPY","EURJPY","GBPJPY","AUDJPY","USDCHF","USDCAD","EURGBP"];

const fld=(id,label,val,extra="")=>`<label class="f ${extra}">${label}<input id="${id}" inputmode="decimal" type="number" step="any" value="${esc(val)}"></label>`;
const riskSeg=(c)=>`<div class="row between full" style="grid-column:1/-1"><span class="small muted">${t("example")}</span><div class="seg" role="group"><button type="button" data-rm="pct" aria-pressed="${c.riskMode==="pct"}">%</button><button type="button" data-rm="usd" aria-pressed="${c.riskMode==="usd"}">$</button></div></div>`;
function warnRisk(o){ return (o.riskPct>2)?`<div class="warn">${t("w_risk")}</div>`:""; }

function calcBody(){ const k=S.calc, c=CS[k];
 if(k==="check") return checklistHTML();
 if(k==="pivot") return pivotBody(c);
 if(k==="prop") return propBody(c);
 if(k==="gold"){ const o=CALC.gold(c);
  const res = o.err?`<div class="warn">${t(o.err)}</div>`:
   `<div class="row between"><span class="muted small">${t("lot")}</span><span class="pill" style="border-color:${o.dir==="buy"?"var(--up)":"var(--down)"}">${t(o.dir)}</span></div>
    <div class="big">${fmt(o.lot,2)} lot</div>
    <div class="kv"><div>${t("actualRisk")}<b>$${fmt(o.actual)}</b></div><div>${t("slDist")}<b>$${fmt(o.dist)} · ${fmt(o.dist*100,0)} pts</b></div>
     ${o.rr?`<div>${t("rrRatio")}<b>1 : ${fmt(o.rr)}</b></div><div>${t("profitTp")}<b>$${fmt(o.profit)}</b></div>`:""}</div>
    ${o.tpErr?`<div class="warn">${t("w_side")}</div>`:""}${o.lot<0.01?`<div class="warn">${t("w_min")}</div>`:`<div class="ok">${t("ok_round")}</div>`}${warnRisk(o)}`;
  return `<div class="fields">${riskSeg(c)}${fld("bal",t("balance"),c.bal)}${fld("risk",c.riskMode==="pct"?t("riskPct"):t("riskUsd"),c.risk)}
    ${fld("entry",t("entry"),c.entry)}${fld("sl",t("sl"),c.sl)}${fld("tp",t("tp"),c.tp)}${fld("contract",t("contract"),c.contract)}</div>
    <div class="result">${res}</div><p class="tip">${t("t_gold")}</p>`; }
 if(k==="fx"||k==="pip"){ const q=c.sym.slice(3); const needRate=q!=="USD"; const rateLabel=`${t("rateOf")} ${RATE_FOR(q)||""}`;
  const symSel=`<label class="f">${t("symbol")}<select id="sym">${SYMS.map(s=>`<option ${s===c.sym?"selected":""}>${s}</option>`).join("")}</select></label>`;
  if(k==="fx"){ const o=CALC.fx(c);
   const res=o.err?`<div class="warn">${t(o.err)}</div>`:`<span class="muted small">${t("lot")}</span><div class="big">${fmt(o.lot,2)} lot</div>
     <div class="kv"><div>${t("actualRisk")}<b>$${fmt(o.actual)}</b></div><div>${t("pipVal")}<b>$${fmt(o.pv)}</b></div></div>
     ${o.lot<0.01?`<div class="warn">${t("w_min")}</div>`:`<div class="ok">${t("ok_round")}</div>`}${warnRisk(o)}`;
   return `<div class="fields">${riskSeg(c)}${fld("bal",t("balance"),c.bal)}${fld("risk",c.riskMode==="pct"?t("riskPct"):t("riskUsd"),c.risk)}
    ${symSel}${fld("slPips",t("slPips"),c.slPips)}${needRate?fld("rate",rateLabel,c.rate,"full"):""}</div><div class="result">${res}</div><p class="tip">${t("t_fx")}</p>`; }
  const pv=CALC.pipValue(c.sym,c.rate)*c.lots;
  return `<div class="fields">${symSel}${fld("lots",t("lots"),c.lots)}${needRate?fld("rate",rateLabel,c.rate,"full"):""}</div>
   <div class="result"><span class="muted small">${t("perPip")}</span><div class="big">$${fmt(pv,2)}</div><div class="kv"><div>${t("perPoint")}<b>$${fmt(pv/10,3)}</b></div><div>XAUUSD · 1 lot<b>$1.00 move = $100</b></div></div></div><p class="tip">${t("t_fx")}</p>`; }
 if(k==="rr"){ const o=CALC.rr(c);
  const res=o.err?`<div class="warn">${t(o.err)}</div>`:`<span class="muted small">${t("rrRatio")}</span><div class="big">1 : ${fmt(o.rr)}</div>
   <div class="kv"><div>${t("breakeven")}<b>${fmt(o.be,1)}%</b></div><div>${t("slDist")}<b>${fmt(o.risk,5).replace(/0+$/,"").replace(/\.$/,"")}</b></div></div>
   ${o.rr<1?`<div class="warn">R:R below 1:1</div>`:""}`;
  return `<div class="fields">${fld("entry",t("entry"),c.entry)}${fld("sl",t("sl"),c.sl)}${fld("tp",t("tp").replace(/ \(.*\)/,""),c.tp,"full")}</div><div class="result">${res}</div><p class="tip">${t("t_rr")}</p>`; }
 if(k==="margin"){ const kinds=[["gold","Gold (XAUUSD)"],["usdq","EURUSD, GBPUSD, AUDUSD…"],["usdb","USDJPY, USDCHF, USDCAD…"],["cross","EURJPY, GBPJPY, EURGBP…"]];
  const m=CALC.margin(c); const needPrice=c.kind!=="usdb";
  const plabel = c.kind==="cross"? `${t("price")} (EUR/USD, GBP/USD…)` : t("price");
  return `<div class="fields"><label class="f full">${t("symbol")}<select id="kind">${kinds.map(([v,l])=>`<option value="${v}" ${v===c.kind?"selected":""}>${l}</option>`).join("")}</select></label>
   ${fld("lots",t("lots"),c.lots)}${fld("lev",t("leverage"),c.lev)}${needPrice?fld("price",plabel,c.price):""}${c.kind==="gold"?fld("contract",t("contract"),c.contract):""}</div>
   <div class="result"><span class="muted small">${t("marginNeed")}</span><div class="big">$${fmt(m)}</div></div><p class="tip">${t("t_margin")}</p>`; }
 if(k==="comp"){ const rows=CALC.comp(c); const fin=rows.length?rows[rows.length-1][1]:c.start;
  return `<div class="fields">${fld("start",t("start"),c.start,"full")}${fld("pct",t("perMonth"),c.pct)}${fld("months",t("months"),c.months)}</div>
   <div class="result"><span class="muted small">${t("final")}</span><div class="big">$${fmt(fin)}</div>
   <div class="tw"><table class="t"><thead><tr><th>${t("month")}</th><th>$</th></tr></thead><tbody>${rows.slice(0,120).map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`).join("")}</tbody></table></div></div><p class="tip">${t("t_comp")}</p>`; }
 if(k==="dd"){ const need=CALC.dd(c.loss);
  return `<div class="fields">${fld("loss",t("ddLoss"),c.loss,"full")}</div>
   <div class="result"><span class="muted small">${t("ddNeed")}</span><div class="big">${isFinite(need)?fmt(need,1)+"%":"∞"}</div>
   <div class="tw"><table class="t"><thead><tr><th>${t("loss")}</th><th>${t("need")}</th></tr></thead><tbody>${[10,20,30,40,50,60,75,90].map(l=>`<tr><td>-${l}%</td><td>+${fmt(CALC.dd(l),1)}%</td></tr>`).join("")}</tbody></table></div></div><p class="tip">${t("t_dd")}</p>`; }
}
function viewCalc(){ const list=[["check","checklist"],["prop","c_prop"],["gold","c_gold"],["pivot","c_pivot"],["fx","c_fx"],["pip","c_pip"],["rr","c_rr"],["margin","c_margin"],["comp","c_comp"],["dd","c_dd"]];
  return `<h2>${t("calc")}</h2><div class="chips" role="group" aria-label="Calculator">${list.map(([k,l])=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${S.calc===k}">${t(l)}</button>`).join("")}</div>
   <section class="card calc" id="calcBody">${calcBody()}</section>`; }

function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|v=)([\w-]{11})/); return m?m[1]:""; }
function vidCard(v,n){ const id=ytId(v.link);
  return `<a class="vid" href="${esc(v.link)}" target="_blank" rel="noopener"><div class="thumb">${id?`<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()" width="320" height="180">`:""}<span class="pl">▶</span>${v.time?`<span class="du">${esc(v.time)}</span>`:""}</div>
   <div style="min-width:0;display:grid;gap:4px">${n?`<span class="vid-n">${t("lecture")} ${n}</span>`:""}<span class="vid-t">${esc(v.title)}</span></div></a>`; }
function viewLearn(){
  if(S.quiz) return quizHTML();
  return `<div><h2>${t("vidTitle")}</h2><div class="small muted">${t("vidSub")}</div></div>${learnTop()}
   <section style="display:grid;gap:10px"><h3>${t("latest")}</h3><div class="vlist">${C.latest.map(v=>vidCard(v)).join("")}</div></section>
   ${C.playlists.map((p,i)=>`<details class="pl-card" ${i===0?"open":""}><summary><span class="eyebrow">${p.videos.filter(v=>SEEN.has(ytId(v.link))).length}/${p.videos.length} ${t("lessons")}</span><h3 dir="ltr" style="text-align:start">${esc(p.name)}</h3><span class="small muted" dir="ltr" style="text-align:start">${esc(p.text)}</span></summary>
     <div class="vlist">${p.videos.map((v,j)=>vidRow(v,p.course?j+1:null)).join("")}<a class="btn ghost" href="${esc(p.link)}" target="_blank" rel="noopener">${t("openYt")}</a></div></details>`).join("")}`; }

function swCard(s){ const site="https://qaziforextips.com/";
  return `<article class="card sw"><div class="row between"><h3>${esc(s.name)}</h3><span class="pill">${esc(s.type)}${s.badge?` · ${esc(s.badge)}`:""}</span></div>
   <p class="small" style="margin:0" dir="ltr">${esc(s.text)}</p><ul dir="ltr">${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
   <div class="row">${s.link?`<a class="btn ghost" href="${site+esc(s.link)}" target="_blank" rel="noopener">${t("page")}</a>`:""}<a class="btn gold" href="${WA_LINK}" target="_blank" rel="noopener">${t("order")}</a></div></article>`; }

const J = {
 r(tr){ const risk=Math.abs(tr.entry-tr.sl); if(!(risk>0)) return NaN; const sgn=tr.dir==="buy"?1:-1; return (tr.exit-tr.entry)*sgn/risk; },
 stats(list){ const rs=list.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(J.r).filter(isFinite); const n=rs.length;
  const wins=rs.filter(r=>r>0), losses=rs.filter(r=>r<0); const sum=a=>a.reduce((x,y)=>x+y,0);
  let streak=0,worst=0; rs.forEach(r=>{ if(r<0){streak++;worst=Math.max(worst,streak);} else streak=0; });
  const usd=list.filter(x=>typeof x.pnl==="number"&&isFinite(x.pnl)).map(x=>x.pnl);
  const grp=(key)=>{ const g={}; list.forEach(x=>{const r=J.r(x); if(!isFinite(r)) return; const k=String(x[key]); (g[k]=g[k]||{n:0,w:0,tot:0}); g[k].n++; g[k].tot+=r; if(r>0) g[k].w++;}); return g; };
  const lossEmo={}; list.forEach(x=>{ if(J.r(x)<0) lossEmo[x.emo]=(lossEmo[x.emo]||0)+1; });
  let eq=0; const curve=[0].concat(rs.map(r=>eq+=r));
  return {n,wins:wins.length,losses:losses.length,winRate:n?wins.length/n*100:0,avgR:n?sum(rs)/n:0,totR:sum(rs),
   pf:losses.length?sum(wins)/Math.abs(sum(losses)):(wins.length?Infinity:0),worst,usd:usd.length?sum(usd):null,
   bySetup:grp("setup"),byPlan:grp("plan"),lossEmo,curve}; },
 today(list,now=new Date()){ const k=d=>{const x=new Date(d);return x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate();}; const tk=k(now);
  const td=list.filter(x=>k(x.date)===tk); return {n:td.length,losses:td.filter(x=>J.r(x)<0).length,r:td.map(J.r).filter(isFinite).reduce((a,b)=>a+b,0)}; }
};

 const x=i=>p+i*(W-2*p)/(pts.length-1), y=v=>H-p-(v-mn)*(H-2*p)/sp; const d=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
 const last=pts[pts.length-1];
 return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Equity curve">
  <line x1="${p}" x2="${W-p}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
  <path d="${d} L${x(pts.length-1)},${y(0)} L${x(0)},${y(0)}Z" fill="var(--gold-soft)" stroke="none"/>
  <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/>

function award(xp,onceKey){ if(onceKey){ if(ACT.once[onceKey]) return; ACT.once[onceKey]=1; } ACT.xp+=xp; ACT.days[todayKey()]=1; store.set("act",ACT); }
const LV=[0,100,300,600,1000,1500];
function levelOf(xp){ let i=0; while(i+1<LV.length&&xp>=LV[i+1]) i++; return {i,next:LV[i+1]??null,base:LV[i]}; }
function streakOf(days,now=new Date()){ let d=new Date(now); if(!days[todayKey(d)]) d.setDate(d.getDate()-1); let n=0; while(days[todayKey(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
window.QFT_XP={levelOf,streakOf,todayKey};

/* ============ PIVOTS & PROP TRACKER (pure, testable) ============ */
const P3={
 pivots({h,l,c}){ const P=(h+l+c)/3; return {R3:h+2*(P-l),R2:P+(h-l),R1:2*P-l,P,S1:2*P-h,S2:P-(h-l),S3:l-2*(h-P)}; },
 prop(x){ const daily = (x.dailyOf==="sod"? x.sodBal : x.size) * x.daily/100;
  const base = x.basis==="higher"? Math.max(x.sodBal,x.sodEq) : x.sodBal;
  const dFloor = base - daily;
  const mFloor = x.maxType==="trail"? Math.min(x.size, Math.max(x.size,x.high) - x.size*x.max/100) : x.size*(1-x.max/100);
  const floor = Math.max(dFloor,mFloor); const room = x.eq - floor; const target = x.size*(1+x.target/100);
  return {daily,dFloor,mFloor,floor,room,target,left:Math.max(0,target-x.eq),prog:Math.max(0,Math.min(100,(x.eq-x.size)/(target-x.size)*100)),
   safe:Math.max(0,room)/3,breach:room<=0,hit:x.eq>=target,daysOk:x.days>=x.minDays}; }
};
window.QFT_P3=P3;

/* ============ DATA: demo generator, MT5 CSV parser, resample ============ */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genDemo(n=6000,tf=15,seed=20261015){ const R=rng(seed), gz=()=>{ let u=0,v=0; while(!u) u=R(); while(!v) v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
 const out=[]; let t=Date.UTC(2026,5,1,0,0), p=3900, drift=0;
 while(out.length<n){ const d=new Date(t); const wd=d.getUTCDay(); if(wd===0||wd===6){ t+=tf*60000; continue; }
  if(out.length%300===0) drift=(R()-0.5)*0.0003; const h=d.getUTCHours(); const sm=h>=15&&h<20?1.6:h>=9&&h<15?1.1:0.6;
  const s=0.0011*sm, o=p, c=o*Math.exp(drift+s*gz()); const hi=Math.max(o,c)+Math.abs(gz())*s*o*0.5, lo=Math.min(o,c)-Math.abs(gz())*s*o*0.5;
  out.push({t,o:+o.toFixed(2),h:+hi.toFixed(2),l:+lo.toFixed(2),c:+c.toFixed(2)}); p=c; t+=tf*60000; }
 return out; }
function parseCSV(txt){ const lines=String(txt).replace(/\r/g,"").split("\n").filter(x=>x.trim()); if(lines.length<20) return null;
 const sp=l=>l.split(/\t|;|,/).map(x=>x.trim().replace(/^"|"$/g,""));
 let start=0; const head=sp(lines[0]).map(x=>x.toUpperCase().replace(/[<>]/g,"")); let map=null;
 if(head.some(x=>/OPEN/.test(x))){ start=1; const f=k=>head.findIndex(x=>x===k||x.startsWith(k)); map={d:f("DATE"),t:f("TIME"),o:f("OPEN"),h:f("HIGH"),l:f("LOW"),c:f("CLOSE")}; }
 const pd=(ds,ts)=>{ let m=String(ds).match(/^(\d{4})[.\-\/]?(\d{2})[.\-\/]?(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/); if(!m) return NaN;
   let hh=+(m[4]||0), mm=+(m[5]||0); if(ts){ const q=String(ts).match(/^(\d{1,2}):(\d{2})/); if(q){hh=+q[1];mm=+q[2];} } return Date.UTC(+m[1],+m[2]-1,+m[3],hh,mm); };
 const out=[];
 for(let i=start;i<lines.length;i++){ const a=sp(lines[i]); let b;
  if(map&&map.o>=0){ b={t:pd(a[map.d],map.t>=0?a[map.t]:null),o:+a[map.o],h:+a[map.h],l:+a[map.l],c:+a[map.c]}; }
  else if(/:/.test(a[1]||"")) b={t:pd(a[0],a[1]),o:+a[2],h:+a[3],l:+a[4],c:+a[5]};
  else b={t:pd(a[0]),o:+a[1],h:+a[2],l:+a[3],c:+a[4]};
  if(isFinite(b.t)&&b.o>0&&b.h>=b.l&&b.c>0) out.push(b); }
 out.sort((x,y)=>x.t-y.t); return out.length>=50?out:null; }
function tfOf(bars){ const d=[]; for(let i=1;i<Math.min(bars.length,300);i++) d.push(bars[i].t-bars[i-1].t); d.sort((a,b)=>a-b); return Math.round((d[Math.floor(d.length/2)]||60000)/60000); }
function resample(bars,k){ if(k<=1) return bars; const tf=tfOf(bars)*k*60000; const out=[]; let cur=null;
 for(const b of bars){ const key=Math.floor(b.t/tf); if(!cur||cur.key!==key){ if(cur) out.push(cur.b); cur={key,b:{t:key*tf,o:b.o,h:b.h,l:b.l,c:b.c}}; } else { cur.b.h=Math.max(cur.b.h,b.h); cur.b.l=Math.min(cur.b.l,b.l); cur.b.c=b.c; } }
 if(cur) out.push(cur.b); return out; }
const tfName=m=>m>=1440?"D1":m>=60?"H"+(m/60):"M"+m;

/* ============ INDICATORS & BACKTEST ENGINE (pure, testable) ============ */
const IND={
 ema(a,n){ const k=2/(n+1), o=new Array(a.length); let e=null; for(let i=0;i<a.length;i++){ e=e==null?a[i]:a[i]*k+e*(1-k); o[i]=i>=n-1?e:NaN; } return o; },
 rsi(a,n){ const o=new Array(a.length).fill(NaN); let g=0,l=0; for(let i=1;i<a.length;i++){ const ch=a[i]-a[i-1], up=Math.max(ch,0), dn=Math.max(-ch,0);
   if(i<=n){ g+=up; l+=dn; if(i===n){ g/=n; l/=n; o[i]=l===0?100:100-100/(1+g/l); } } else { g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n; o[i]=l===0?100:100-100/(1+g/l); } } return o; },
 atr(b,n){ const o=new Array(b.length).fill(NaN); let a=0; for(let i=1;i<b.length;i++){ const tr=Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c));
   if(i<=n){ a+=tr; if(i===n){ a/=n; o[i]=a; } } else { a=(a*(n-1)+tr)/n; o[i]=a; } } return o; }
};
function signals(bars,s){ const c=bars.map(b=>b.c), n=bars.length, sig=new Array(n).fill(0); const tr=s.trend>0?IND.ema(c,s.trend):null;
 const okT=(i,d)=>!tr||(isFinite(tr[i])&&(d>0?c[i]>tr[i]:c[i]<tr[i]));
 if(s.id==="ema"){ const f=IND.ema(c,s.fast), sl=IND.ema(c,s.slow); for(let i=1;i<n;i++){ if(!isFinite(f[i-1])||!isFinite(sl[i-1])) continue;

 m.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ LAB.strat=b.dataset.st; saveLab(); render(); });
 m.querySelectorAll("[data-grp]").forEach(i=>i.oninput=()=>{ const v=parseFloat(i.value); if(!isFinite(v)) return; (i.dataset.grp==="p"?LAB.p[LAB.strat]:LAB.c)[i.dataset.k]=v; saveLab(); });
 [["cDir","dir"],["cSl","sl"]].forEach(([id,k])=>{ const s=$("#"+id); if(s) s.onchange=()=>{ LAB.c[k]=s.value; saveLab(); render(); }; });
 const run=$("#btRun"); if(run) run.onclick=()=>{ const bars=getBars(); const s=Object.assign({id:LAB.strat},LAB.p[LAB.strat]);
   BT_RES={r:backtest(bars,s,LAB.c),bars,name:t("s_"+LAB.strat)}; $("#btOut").innerHTML=btResults(); $("#btOut").scrollIntoView({block:"start"}); };
 if($("#rpCv")){ rpUI();
  $("#rpPlay").onclick=()=>{ if(RP.playing) rpStop(); else { RP.playing=true; RP.timer=setInterval(rpStep,1000/RP.speed); } rpUI(); };
  $("#rpStep").onclick=()=>{ rpStop(); rpStep(); };
  m.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{ RP.speed=+b.dataset.sp; saveRp(); m.querySelectorAll("[data-sp]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); if(RP.playing){ rpStop(); RP.playing=true; RP.timer=setInterval(rpStep,1000/RP.speed); } });
  [["rp_sld","sld"],["rp_rr","rr"],["rp_risk","risk"]].forEach(([id,k])=>{ const i=$("#"+id); i.oninput=()=>{ const v=parseFloat(i.value); if(isFinite(v)&&v>0){ RP[k]=v; saveRp(); rpUI(); } }; });
  $("#rpBuy").onclick=()=>rpOpen(1); $("#rpSell").onclick=()=>rpOpen(-1);
  $("#rpClose").onclick=()=>{ if(RP.pos){ rpExit(getBars()[RP.i].c,"Manual"); rpUI(); } };
  const pc=$("#rp_pct"); pc.oninput=()=>{ RP.pct=+pc.value; saveRp(); };
  $("#rpGo").onclick=()=>{ rpStart(); rpUI(); }; }
}
function viewLab(){ return `<div><h2>${t("lab_title")}</h2></div>
  <div class="seg" role="group" style="justify-self:start">${[["live","lv_tab"],["bt","bt"],["rp","rp"]].map(([k,l])=>`<button type="button" data-lm="${k}" aria-pressed="${LAB.mode===k}">${t(l)}</button>`).join("")}</div>
  ${LAB.mode==="live"?liveView():dataCard()+(LAB.mode==="bt"?btView():rpView())}`; }
window.addEventListener("resize",()=>{ if($("#rpCv")) drawReplay(); });


/* ============ LIVE CHART (TradingView Advanced Chart widget) ============ */
Object.assign(T.en,{lv_tab:"Live chart",lv_fail:"The live chart loads in the installed app. This preview can't load TradingView's chart.",lv_note:"Chart and data by TradingView. Gold Plan levels are shown below the chart."});
Object.assign(T.ur,{lv_tab:"لائیو چارٹ",lv_fail:"لائیو چارٹ انسٹال شدہ ایپ میں چلے گا۔ یہ پریویو TradingView کا چارٹ لوڈ نہیں کر سکتا۔",lv_note:"چارٹ اور ڈیٹا TradingView کا۔ گولڈ پلان کے لیولز چارٹ کے نیچے ہیں۔"});
const LV_SYMS=[["OANDA:XAUUSD","Gold"],["OANDA:XAGUSD","Silver"],["TVC:DXY","DXY"],["OANDA:EURUSD","EURUSD"],["OANDA:GBPUSD","GBPUSD"],["OANDA:USDJPY","USDJPY"],["BITSTAMP:BTCUSD","BTC"]];
const LV_TFS=[["5","M5"],["15","M15"],["60","H1"],["240","H4"],["D","D1"]];
const LIVE=Object.assign({sym:"OANDA:XAUUSD",tf:"15"},store.get("live",{}));
function liveView(){ const p=S.plan;
 return `<div class="chips" role="group">${LV_SYMS.map(([v,l])=>`<button type="button" class="chip" data-lsym="${v}" aria-pressed="${LIVE.sym===v}">${l}</button>`).join("")}</div>
  <div class="chips" role="group">${LV_TFS.map(([v,l])=>`<button type="button" class="chip" data-ltf="${v}" aria-pressed="${LIVE.tf===v}">${l}</button>`).join("")}</div>
  <div id="tvBox" style="height:62vh;min-height:360px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);position:relative"></div>
  ${LIVE.sym==="OANDA:XAUUSD"&&p?`<div class="lvls" dir="ltr">${(p.levels||[]).map(l=>`<div class="lv ${/^R/.test(l.n)?"r":/^S/.test(l.n)?"s":"p"}"><span>${esc(l.n)}</span><b>${esc(l.p)}</b></div>`).join("")}</div>`:""}
  <p class="small muted" style="margin:0">${t("lv_note")}</p>`; }
function mountLive(){ const box=$("#tvBox"); if(!box) return; box.innerHTML="";
 const dark=document.documentElement.getAttribute("data-theme")!=="light" && !(S.theme==="system"&&matchMedia("(prefers-color-scheme: light)").matches);
 const c=document.createElement("div"); c.className="tradingview-widget-container"; c.style.cssText="height:100%;width:100%";
 const w=document.createElement("div"); w.className="tradingview-widget-container__widget"; w.style.cssText="height:calc(100% - 32px);width:100%";
 const cr=document.createElement("div"); cr.className="tradingview-widget-copyright small"; cr.style.cssText="line-height:32px;text-align:center";
 const nm=(LV_SYMS.find(x=>x[0]===LIVE.sym)||[0,LIVE.sym])[1];
 cr.innerHTML=`<a href="https://www.tradingview.com/symbols/${LIVE.sym.replace(":","-")}/" rel="noopener nofollow" target="_blank">${esc(nm)} chart</a> by TradingView`;
 const sc=document.createElement("script"); sc.async=true; sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
 sc.innerHTML=JSON.stringify({autosize:true,symbol:LIVE.sym,interval:LIVE.tf,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"Etc/UTC",theme:dark?"dark":"light",style:"1",locale:"en",
  backgroundColor:dark?"rgba(21,29,48,1)":"rgba(255,255,255,1)",withdateranges:true,hide_side_toolbar:false,allow_symbol_change:true,save_image:false,calendar:false,
  studies:["MAExp@tv-basicstudies","RSI@tv-basicstudies"],support_host:"https://www.tradingview.com"});
 const fail=()=>{ if(box.querySelector(".lv-fail")) return; const d=document.createElement("div"); d.className="empty lv-fail"; d.style.cssText="position:absolute;inset:0;display:grid;place-items:center;padding:20px"; d.textContent=t("lv_fail"); box.appendChild(d); };
 sc.onerror=fail; c.append(w,cr,sc); box.appendChild(c); setTimeout(()=>{ if($("#tvBox")===box && !box.querySelector("iframe")) fail(); },8000); }
function bindLive(m){ m.querySelectorAll("[data-lsym]").forEach(b=>b.onclick=()=>{ LIVE.sym=b.dataset.lsym; store.set("live",LIVE); render(); });
 m.querySelectorAll("[data-ltf]").forEach(b=>b.onclick=()=>{ LIVE.tf=b.dataset.ltf; store.set("live",LIVE); render(); }); if($("#tvBox")) mountLive(); }
/* ============ RENDER & EVENTS ============ */
function render(){ const v={home:viewHome,news:viewNews,calc:viewCalc,journal:viewJournal,lab:viewLab,learn:viewLearn,more:viewMore}[S.tab]();
  $("#main").innerHTML=`<div class="view">${v}</div>`; bind(); tick(); }
function bind(){ const m=$("#main");
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  m.querySelectorAll("[data-golive]").forEach(b=>b.onclick=()=>{ LAB.mode="live"; saveLab(); go("lab"); });
  m.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>go("calc",{calc:b.dataset.calc}));
  m.querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>{S.impact=b.dataset.imp;store.set("impact",S.impact);render();});
  m.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{S.cur=b.dataset.cur;store.set("cur",S.cur);render();});
  m.querySelectorAll(".ev").forEach(b=>b.onclick=()=>{const n=b.querySelector(".note");if(n){n.hidden=!n.hidden;b.setAttribute("aria-expanded",String(!n.hidden));}});
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.calc=b.dataset.c;render();});
  m.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;store.set("lang",S.lang);applyLang();renderTabs();render();});
  m.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.themeSet;store.set("theme",S.theme);applyTheme();render();});
  const cw=$("#copyWa"); if(cw) cw.onclick=()=>{ const ok=()=>cw.textContent=t("copied");
    if(navigator.clipboard) navigator.clipboard.writeText(WA).then(ok).catch(()=>selectText($("#waNum"))); else selectText($("#waNum")); };
  const cb=$("#calcBody"); if(cb&&S.calc!=="check") bindCalc(cb); bindV2(m); bindV3(m); bindLab(m); bindLive(m); }
function selectText(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function bindCalc(cb){ const c=CS[S.calc];
  cb.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ if(c.riskMode===b.dataset.rm) return;
    c.riskMode=b.dataset.rm; c.risk = c.riskMode==="usd"? +(c.bal*c.risk/100).toFixed(2) : +(c.risk/c.bal*100).toFixed(2); save(); });
  cb.querySelectorAll("input").forEach(i=>i.oninput=()=>{ const v=parseFloat(i.value); c[i.id]=isFinite(v)?v:0; store.set("calc",CS); refreshResult(); });
  cb.querySelectorAll("select").forEach(s=>s.onchange=()=>{ c[s.id]=s.value;
    if(s.id==="sym"){ const q=s.value.slice(3); if(q!=="USD") c.rate = (s.value.startsWith("USD")&&q==="JPY")?c.rate||150:RATE_DEF[q]; }
    if(s.id==="kind"){ c.price = s.value==="gold"?4100 : s.value==="usdq"?1.16 : s.value==="cross"?1.16 : c.price; }
    save(); });
  function save(){ store.set("calc",CS); $("#calcBody").innerHTML=calcBody(); bindCalc($("#calcBody")); }
  function refreshResult(){ // keep focus in the field: only swap result + tip
    const tmp=document.createElement("div"); tmp.innerHTML=calcBody(); const r=tmp.querySelector(".result"); if(r) cb.querySelector(".result").replaceWith(r); } }

let lastSess=0;
function tick(){ const cd=$("#countdown"); if(cd){ const ms=+cd.dataset.at-Date.now(); if(ms<=0){ render(); return; }
   const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), mi=Math.floor(s%3600/60), se=s%60;
   cd.textContent=(d?d+"d ":"")+[h,mi,se].map(x=>String(x).padStart(2,"0")).join(":"); }
  const se=$("#sess"); if(se && Date.now()-lastSess>30000){ lastSess=Date.now(); se.innerHTML=sessionsHTML(); } }
setInterval(tick,1000);

applyTheme(); applyLang(); renderTabs(); render();
loadCalendar().then(()=>{ if(S.tab==="home"||S.tab==="news") render(); });
loadPlan().then(()=>{ if(S.tab==="home") render(); });
</script>
