<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Bar chart: a 1 lot EURUSD position of 110,000 dollars needs 3,667 dollars margin at 1:30, 1,100 at 1:100 and 220 at 1:500" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Bar chart: a 1 lot EURUSD position of 110,000 dollars needs 3,667 dollars margin at 1:30, 1,100 at 1:100 and 220 at 1:500</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >Leverage changes the margin, not the risk per pip</text><text x="32" y="80" font-size="16" fill="#9aa4b8" text-anchor="start" font-weight="500" >1 lot EURUSD at 1.1000 = a $110,000 position</text><text x="234" y="170" font-size="18" fill="#eef1f6" text-anchor="end" font-weight="700" >Position value</text><rect x="250" y="140" width="630.0" height="44" rx="8" fill="#5b9cf5"/><text x="868.0" y="170" font-size="19" fill="#0d1220" text-anchor="end" font-weight="800" >$110,000</text><text x="234" y="242" font-size="18" fill="#eef1f6" text-anchor="end" font-weight="700" >Margin at 1:30</text><rect x="250" y="212" width="21.0" height="44" rx="8" fill="#e7b53c"/><text x="283.0" y="242" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >$3,667</text><text x="234" y="314" font-size="18" fill="#eef1f6" text-anchor="end" font-weight="700" >Margin at 1:100</text><rect x="250" y="284" width="6.3" height="44" rx="8" fill="#e7b53c"/><text x="268.3" y="314" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >$1,100</text><text x="234" y="386" font-size="18" fill="#eef1f6" text-anchor="end" font-weight="700" >Margin at 1:500</text><rect x="250" y="356" width="6.0" height="44" rx="8" fill="#e7b53c"/><text x="268" y="386" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >$220</text><rect x="60" y="440" width="840" height="64" rx="12" fill="#141b2d" stroke="#243049"/><text x="84" y="470" font-size="18" fill="#eef1f6" text-anchor="start" font-weight="700" >Pip value stays about $10 per pip for 1 lot at every leverage.</text><text x="84" y="494" font-size="16" fill="#9aa4b8" text-anchor="start" font-weight="500" >What protects the account is the lot size you choose, not the leverage offered.</text><text x="938" y="524" text-anchor="end" font-size="13" fill="#9aa4b8" opacity=".8">qaziforextips.com</text></svg>