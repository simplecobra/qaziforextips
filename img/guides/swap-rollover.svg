<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Weekday strip showing a swap charge at each nightly rollover from Monday to Thursday, triple on Wednesday night, and an example swap calculation" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Weekday strip showing a swap charge at each nightly rollover from Monday to Thursday, triple on Wednesday night, and an example swap calculation</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >When swap is charged: the daily rollover</text><text x="32" y="80" font-size="16" fill="#9aa4b8" text-anchor="start" font-weight="500" >Rollover ≈ 5 PM New York = about 2 AM PKT (summer) / 3 AM PKT (winter)</text><rect x="60" y="120" width="154" height="96" rx="12" fill="#141b2d" stroke="#243049"/><text x="137.0" y="176" font-size="24" fill="#eef1f6" text-anchor="middle" font-weight="800" >Mon</text><line x1="221" x2="221" y1="110" y2="250" stroke="#5b9cf5" stroke-width="3" stroke-dasharray="5 4"/><rect x="182.6" y="261.0" width="76.9" height="27" rx="6" fill="#5b9cf5"/><text x="221.0" y="282" font-size="15" fill="#0d1220" text-anchor="middle" font-weight="800" >swap ×1</text><rect x="228" y="120" width="154" height="96" rx="12" fill="#141b2d" stroke="#243049"/><text x="305.0" y="176" font-size="24" fill="#eef1f6" text-anchor="middle" font-weight="800" >Tue</text><line x1="389" x2="389" y1="110" y2="250" stroke="#5b9cf5" stroke-width="3" stroke-dasharray="5 4"/><rect x="350.6" y="261.0" width="76.9" height="27" rx="6" fill="#5b9cf5"/><text x="389.0" y="282" font-size="15" fill="#0d1220" text-anchor="middle" font-weight="800" >swap ×1</text><rect x="396" y="120" width="154" height="96" rx="12" fill="#141b2d" stroke="#243049"/><text x="473.0" y="176" font-size="24" fill="#eef1f6" text-anchor="middle" font-weight="800" >Wed</text><line x1="557" x2="557" y1="110" y2="250" stroke="#e7b53c" stroke-width="3" stroke-dasharray="5 4"/><rect x="518.5" y="261.0" width="76.9" height="27" rx="6" fill="#e7b53c"/><text x="557.0" y="282" font-size="15" fill="#0d1220" text-anchor="middle" font-weight="800" >swap ×3</text><rect x="564" y="120" width="154" height="96" rx="12" fill="#141b2d" stroke="#243049"/><text x="641.0" y="176" font-size="24" fill="#eef1f6" text-anchor="middle" font-weight="800" >Thu</text><line x1="725" x2="725" y1="110" y2="250" stroke="#5b9cf5" stroke-width="3" stroke-dasharray="5 4"/><rect x="686.5" y="261.0" width="76.9" height="27" rx="6" fill="#5b9cf5"/><text x="725.0" y="282" font-size="15" fill="#0d1220" text-anchor="middle" font-weight="800" >swap ×1</text><rect x="732" y="120" width="154" height="96" rx="12" fill="#141b2d" stroke="#243049"/><text x="809.0" y="176" font-size="24" fill="#eef1f6" text-anchor="middle" font-weight="800" >Fri</text><text x="809.0" y="240" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="600" >weekend: no rollover</text><rect x="40" y="318" width="880" height="176" rx="14" fill="#141b2d" stroke="#243049"/><text x="64" y="354" font-size="19" fill="#e7b53c" text-anchor="start" font-weight="800" >Swap per night = swap points × point value × lots</text><text x="64" y="390" font-size="16" fill="#eef1f6" text-anchor="start" font-weight="600" >Illustration: EURUSD swap long −6.2 points, 1 point = $1 per lot (5-digit price)</text><text x="64" y="422" font-size="16" fill="#eef1f6" text-anchor="start" font-weight="600" >1 lot: −$6.20 a night  ·  0.10 lot: −$0.62  ·  0.10 lot on Wednesday (×3): −$1.86</text><text x="64" y="458" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="500" >Wednesday is triple because spot settles 2 business days later and carries the weekend.</text><text x="64" y="482" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="500" >Check your broker&#x27;s live values: MT5 → Market Watch → right-click → Specification.</text><text x="938" y="524" text-anchor="end" font-size="13" fill="#9aa4b8" opacity=".8">qaziforextips.com</text></svg>