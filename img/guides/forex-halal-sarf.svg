<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Comparison: Shariah conditions for currency exchange (spot, possession, no interest, no loan) next to how a typical retail CFD forex account works (no delivery, broker counterparty, leverage, swap)" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Comparison: Shariah conditions for currency exchange (spot, possession, no interest, no loan) next to how a typical retail CFD forex account works (no delivery, broker counterparty, leverage, swap)</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >Currency exchange in Shariah vs typical online forex</text><text x="32" y="80" font-size="16" fill="#9aa4b8" text-anchor="start" font-weight="500" >What scholars check. A summary of published fatwas, not a fatwa.</text><rect x="40" y="104" width="430" height="300" rx="14" fill="#141b2d" stroke="#26a69a" stroke-opacity=".6"/><text x="62" y="142" font-size="21" fill="#26a69a" text-anchor="start" font-weight="800" >Conditions of bay&#x27; al-sarf</text><circle cx="68" cy="183" r="4" fill="#26a69a"/><text x="82" y="188" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >Spot: both sides exchanged</text><text x="82" y="212" font-size="17" fill="#9aa4b8" text-anchor="start" font-weight="500" >in the same session</text><circle cx="68" cy="245" r="4" fill="#26a69a"/><text x="82" y="250" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >Possession (qabd) before</text><text x="82" y="274" font-size="17" fill="#9aa4b8" text-anchor="start" font-weight="500" >selling it on</text><circle cx="68" cy="307" r="4" fill="#26a69a"/><text x="82" y="312" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >No interest (riba)</text><circle cx="68" cy="345" r="4" fill="#26a69a"/><text x="82" y="350" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >No loan tied to the sale</text><rect x="490" y="104" width="430" height="300" rx="14" fill="#141b2d" stroke="#ef5350" stroke-opacity=".6"/><text x="512" y="142" font-size="21" fill="#ef5350" text-anchor="start" font-weight="800" >Typical retail CFD account</text><circle cx="518" cy="183" r="4" fill="#ef5350"/><text x="532" y="188" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >You trade a contract (CFD);</text><text x="532" y="212" font-size="17" fill="#9aa4b8" text-anchor="start" font-weight="500" >you never receive the currency</text><circle cx="518" cy="245" r="4" fill="#ef5350"/><text x="532" y="250" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >Broker is often the other side</text><circle cx="518" cy="283" r="4" fill="#ef5350"/><text x="532" y="288" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >Leverage = broker funds the</text><text x="532" y="312" font-size="17" fill="#9aa4b8" text-anchor="start" font-weight="500" >position size</text><circle cx="518" cy="345" r="4" fill="#ef5350"/><text x="532" y="350" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >Swap = overnight interest</text><rect x="40" y="424" width="880" height="72" rx="12" fill="#141b2d" stroke="#243049"/><text x="62" y="454" font-size="16" fill="#eef1f6" text-anchor="start" font-weight="600" >Scholars differ: many say typical online forex does not meet these conditions; a few</text><text x="62" y="478" font-size="16" fill="#e7b53c" text-anchor="start" font-weight="700" >fatwas allow it with immediate settlement and no interest. Ask a qualified mufti.</text><text x="938" y="524" text-anchor="end" font-size="13" fill="#9aa4b8" opacity=".8">qaziforextips.com</text></svg>