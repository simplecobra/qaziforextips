<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Gold value per dollar move for 1, 0.1 and 0.01 lot, the Gold lot size formula, and a timeline of Tokyo, London and New York sessions in Pakistan time with the overlap from about 5 to 9 PM" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Gold value per dollar move for 1, 0.1 and 0.01 lot, the Gold lot size formula, and a timeline of Tokyo, London and New York sessions in Pakistan time with the overlap from about 5 to 9 PM</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >Gold (XAUUSD): value per move and the best hours (PKT)</text><rect x="40" y="100" width="420" height="190" rx="14" fill="#141b2d" stroke="#243049"/><text x="66" y="136" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="700" >Lot</text><text x="201" y="136" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="700" >$ per $1 move</text><text x="336" y="136" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="700" >$5 move</text><text x="66" y="172" font-size="18" fill="#eef1f6" text-anchor="start" font-weight="800" >1.00</text><text x="201" y="172" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >$100</text><text x="336" y="172" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >$500</text><text x="66" y="208" font-size="18" fill="#eef1f6" text-anchor="start" font-weight="800" >0.10</text><text x="201" y="208" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >$10</text><text x="336" y="208" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >$50</text><text x="66" y="244" font-size="18" fill="#eef1f6" text-anchor="start" font-weight="800" >0.01</text><text x="201" y="244" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >$1</text><text x="336" y="244" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >$5</text><text x="66" y="278" font-size="13" fill="#9aa4b8" text-anchor="start" font-weight="500" >100-ounce contract (most brokers)</text><rect x="490" y="100" width="430" height="190" rx="14" fill="#141b2d" stroke="#243049"/><text x="514" y="138" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >Lot size for Gold</text><text x="514" y="172" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="700" >lot = risk ÷ (stop in $ × 100)</text><text x="514" y="214" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="600" >$20 risk, $5 stop</text><text x="514" y="242" font-size="18" fill="#e7b53c" text-anchor="start" font-weight="800" >20 ÷ (5 × 100) = 0.04 lot</text><text x="40" y="318" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="600" >Sessions in Pakistan time (summer, approx.; winter about 1 hour later for London/New York)</text><line x1="60.0" x2="60.0" y1="352" y2="498" stroke="#243049"/><text x="60.0" y="518" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="500" >00:00</text><line x1="162.5" x2="162.5" y1="352" y2="498" stroke="#243049"/><text x="162.5" y="518" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="500" >03:00</text><line x1="265.0" x2="265.0" y1="352" y2="498" stroke="#243049"/><text x="265.0" y="518" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="500" >06:00</text><line x1="367.5" x2="367.5" y1="352" y2="498" stroke="#243049"/><text x="367.5" y="518" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="500" >09:00</text><line x1="470.0" x2="470.0" y1="352" y2="498" stroke="#243049"/><text x="470.0" y="518" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="500" >12:00</text><line x1="572.5" x2="572.5" y1="352" y2="498" stroke="#243049"/><text x="572.5" y="518" font-size="13" fill="#9aa4b8" text-anchor="middle" font-weight="500" >15:00</text><line x1="675.0" x2=