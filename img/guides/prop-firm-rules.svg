<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Illustrative equity curve rising from 100,000 to the 110,000 profit target while staying above the 90,000 maximum loss level, with a 5 percent daily loss limit band" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Illustrative equity curve rising from 100,000 to the 110,000 profit target while staying above the 90,000 maximum loss level, with a 5 percent daily loss limit band</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >A typical two-step challenge on a $100,000 account</text><text x="32" y="80" font-size="16" fill="#9aa4b8" text-anchor="start" font-weight="500" >Illustration of the common rules. Each firm&#x27;s numbers differ: read yours.</text><line x1="110" x2="900" y1="110.0" y2="110.0" stroke="#243049" stroke-width="1"/><line x1="110" x2="900" y1="171.7" y2="171.7" stroke="#243049" stroke-width="1"/><line x1="110" x2="900" y1="233.3" y2="233.3" stroke="#243049" stroke-width="1"/><line x1="110" x2="900" y1="295.0" y2="295.0" stroke="#243049" stroke-width="1"/><line x1="110" x2="900" y1="356.7" y2="356.7" stroke="#243049" stroke-width="1"/><line x1="110" x2="900" y1="418.3" y2="418.3" stroke="#243049" stroke-width="1"/><line x1="110" x2="900" y1="480.0" y2="480.0" stroke="#243049" stroke-width="1"/><text x="98" y="430.1851851851852" font-size="14" fill="#9aa4b8" text-anchor="end" font-weight="600" >$90k</text><text x="98" y="361.6666666666667" font-size="14" fill="#9aa4b8" text-anchor="end" font-weight="600" >$95k</text><text x="98" y="293.14814814814815" font-size="14" fill="#9aa4b8" text-anchor="end" font-weight="600" >$100k</text><text x="98" y="224.62962962962962" font-size="14" fill="#9aa4b8" text-anchor="end" font-weight="600" >$105k</text><text x="98" y="156.11111111111114" font-size="14" fill="#9aa4b8" text-anchor="end" font-weight="600" >$110k</text><line x1="110" x2="900" y1="151.1" y2="151.1" stroke="#26a69a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="892" y="141.11111111111114" font-size="15" fill="#26a69a" text-anchor="end" font-weight="800" >Profit target +10% = $110,000</text><line x1="110" x2="900" y1="425.2" y2="425.2" stroke="#ef5350" stroke-width="2.5" stroke-dasharray="8 6"/><text x="892" y="447.1851851851852" font-size="15" fill="#ef5350" text-anchor="end" font-weight="800" >Max loss −10% = $90,000 (fail)</text><polyline points="130.0,288.1 174.1,279.9 218.2,290.9 262.4,271.7 306.5,253.9 350.6,262.1 394.7,241.6 438.8,232.0 482.9,249.8 527.1,234.7 571.2,211.4 615.3,203.2 659.4,218.3 703.5,192.2 747.6,174.4 791.8,184.0 835.9,162.1 880.0,147.0" fill="none" stroke="#e7b53c" stroke-width="3.5" stroke-linejoin="round"/><circle cx="880.0" cy="147.0" r="7" fill="#26a69a"/><rect x="438.8" y="232.0" width="44.1" height="68.5" fill="#ef5350" opacity=".12" stroke="#ef5350" stroke-dasharray="4 4"/><text x="442.8235294117647" y="322.4814814814815" font-size="14" fill="#ef5350" text-anchor="start" font-weight="700" >Daily loss limit: −5% of the</text><text x="442.8235294117647" y="340.4814814814815" font-size="14" fill="#ef5350" text-anchor="start" font-weight="700" >starting balance in one day</text><text x="130" y="512" font-size="15" fill="#9aa4b8" text-anchor="start" font-weight="600" >Phase 2 (verification) usually asks +5% under the same loss limits.</text><text x="938" y="524" text-anchor="end" font-size="13" fill="#9aa4b8" opacity=".8">qaziforextips.com</text></svg>