<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Bar chart of drawdowns of 10, 20, 30, 50 and 75 percent and the gains needed to recover them: 11.1, 25, 42.9, 100 and 300 percent; and the account loss after 10 losing trades at 1, 2 and 5 percent risk" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Bar chart of drawdowns of 10, 20, 30, 50 and 75 percent and the gains needed to recover them: 11.1, 25, 42.9, 100 and 300 percent; and the account loss after 10 losing trades at 1, 2 and 5 percent risk</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >Drawdown: the deeper the loss, the harder the way back</text><text x="70" y="100" font-size="17" fill="#eef1f6" text-anchor="start" font-weight="800" >Loss  vs  gain needed to get back</text><line x1="70" x2="610" y1="470.0" y2="470.0" stroke="#243049"/><text x="62" y="475.0" font-size="12" fill="#9aa4b8" text-anchor="end" font-weight="500" >0%</text><line x1="70" x2="610" y1="353.3" y2="353.3" stroke="#243049"/><text x="62" y="358.3333333333333" font-size="12" fill="#9aa4b8" text-anchor="end" font-weight="500" >50%</text><line x1="70" x2="610" y1="236.7" y2="236.7" stroke="#243049"/><text x="62" y="241.66666666666666" font-size="12" fill="#9aa4b8" text-anchor="end" font-weight="500" >100%</text><line x1="70" x2="610" y1="120.0" y2="120.0" stroke="#243049"/><text x="62" y="125.0" font-size="12" fill="#9aa4b8" text-anchor="end" font-weight="500" >150%</text><rect x="94" y="446.7" width="46" height="23.3" rx="5" fill="#ef5350" opacity=".9"/><rect x="144" y="444.1" width="46" height="25.9" rx="5" fill="#26a69a" opacity=".9"/><text x="117.0" y="438.6666666666667" font-size="14" fill="#ef5350" text-anchor="middle" font-weight="800" >−10%</text><text x="167.0" y="436.1" font-size="14" fill="#26a69a" text-anchor="middle" font-weight="800" >+11.1%</text><r