<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Five steps of forex risk management: risk 1% of $1,000 = $10, stop loss 25 pips, lot size 0.04, target 1:2 = $20, daily stop after 2 to 3 losses; and the account loss after 10 losing trades at 1%, 2% and 5% risk: 9.6%, 18.3% and 40.1%" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title>Five steps of forex risk management: risk 1% of $1,000 = $10, stop loss 25 pips, lot size 0.04, target 1:2 = $20, daily stop after 2 to 3 losses; and the account loss after 10 losing trades at 1%, 2% and 5% risk: 9.6%, 18.3% and 40.1%</title><rect width="960" height="540" rx="18" fill="#0d1220"/><text x="32" y="52" font-size="26" fill="#eef1f6" text-anchor="start" font-weight="800" >Risk management in five steps</text><text x="32" y="80" font-size="16" fill="#9aa4b8" text-anchor="start" font-weight="500" >Decide the risk first; the lot size comes last</text><rect x="32" y="120" width="168" height="190" rx="14" fill="#141b2d" stroke="#e7b53c" stroke-width="2"/><circle cx="62" cy="154" r="16" fill="#e7b53c"/><text x="62" y="160" font-size="17" fill="#0d1220" text-anchor="middle" font-weight="800" >1</text><text x="48" y="204" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >Risk per trade</text><text x="48" y="236" font-size="14" fill="#9aa4b8" text-anchor="start" font-weight="500" >1% of $1,000</text><text x="48" y="280" font-size="20" fill="#e7b53c" text-anchor="start" font-weight="800" >= $10</text><text x="207.0" y="220" font-size="26" fill="#9aa4b8" text-anchor="middle" font-weight="800" >›</text><rect x="214" y="120" width="168" height="190" rx="14" fill="#141b2d" stroke="#ef5350" stroke-width="2"/><circle cx="244" cy="154" r="16" fill="#ef5350"/><text x="244" y="160" font-size="17" fill="#0d1220" text-anchor="middle" font-weight="800" >2</text><text x="230" y="204" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >Stop loss</text><text x="230" y="236" font-size="14" fill="#9aa4b8" text-anchor="start" font-weight="500" >idea proven wrong</text><text x="230" y="280" font-size="20" fill="#ef5350" text-anchor="start" font-weight="800" >25 pips</text><text x="389.0" y="220" font-size="26" fill="#9aa4b8" text-anchor="middle" font-weight="800" >›</text><rect x="396" y="120" width="168" height="190" rx="14" fill="#141b2d" stroke="#5b9cf5" stroke-width="2"/><circle cx="426" cy="154" r="16" fill="#5b9cf5"/><text x="426" y="160" font-size="17" fill="#0d1220" text-anchor="middle" font-weight="800" >3</text><text x="412" y="204" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >Lot size</text><text x="412" y="236" font-size="14" fill="#9aa4b8" text-anchor="start" font-weight="500" >$10 ÷ (25 × $10)</text><text x="412" y="280" font-size="20" fill="#5b9cf5" text-anchor="start" font-weight="800" >= 0.04 lot</text><text x="571.0" y="220" font-size="26" fill="#9aa4b8" text-anchor="middle" font-weight="800" >›</text><rect x="578" y="120" width="168" height="190" rx="14" fill="#141b2d" stroke="#26a69a" stroke-width="2"/><circle cx="608" cy="154" r="16" fill="#26a69a"/><text x="608" y="160" font-size="17" fill="#0d1220" text-anchor="middle" font-weight="800" >4</text><text x="594" y="204" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >Target</text><text x="594" y="236" font-size="14" fill="#9aa4b8" text-anchor="start" font-weight="500" >real level, 1:2</text><text x="594" y="280" font-size="20" fill="#26a69a" text-anchor="start" font-weight="800" >50 pips = $20</text><text x="753.0" y="220" font-size="26" fill="#9aa4b8" text-anchor="middle" font-weight="800" >›</text><rect x="760" y="120" width="168" height="190" rx="14" fill="#141b2d" stroke="#9aa4b8" stroke-width="2"/><circle cx="790" cy="154" r="16" fill="#9aa4b8"/><text x="790" y="160" font-size="17" fill="#0d1220" text-anchor="middle" font-weight="800" >5</text><text x="776" y="204" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="800" >Daily stop</text><text x="776" y="236" font-size="14" fill="#9aa4b8" text-anchor="start" font-weight="500" >2–3 losses or −3%</text><text x="776" y="280" font-size="20" fill="#9aa4b8" text-anchor="start" font-weight="800" >then stop</text><rect x="32" y="340" width="896" height="150" rx="14" fill="#141b2d" stroke="#243049"/><text x="56" y="378" font-size="18" fill="#eef1f6" text-anchor="start" font-weight="800" >Why it matters: 10 losses in a row</text><text x="56" y="415" font-size="15" fill="#e7b53c" text-anchor="start" font-weight="700" >1% risk</text><rect x="150" y="400" width="134.4" height="18" rx="4" fill="#ef5350" opacity=".85"/><text x="292.4" y="415" font-size="14" fill="#eef1f6" text-anchor="start" font-weight="600" >−9.6% of the account</text><text x="56" y="443" font-size="15" fill="#e7b53c" text-anchor="start" font-weight="700" >2% risk</text><rect x="150" y="428" width="256.2" height="18" rx="4" fill="#ef5350" opacity=".85"/><text x="414.2" y="443" font-size="14" fill="#eef1f6" text-anchor="start" font-weight="600" >−18.3% of the account</text><text x="56" y="471" font-size="15" fill="#e7b53c" text-anchor="start" font-weight="700" >5% risk</text><rect x="150" y="456" width="561.4" height="18" rx="4" fill="#ef5350" opacity=".85"/><text x="719.4" y="471" font-size="14" fill="#eef1f6" text-anchor="start" font-weight="600" >−40.1% of the account</text><text x="938" y="524" text-anchor="end" font-size="13" fill="#9aa4b8" opacity=".8">qaziforextips.com</text></svg>