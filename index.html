<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Qazi Forex Tips</title>
<meta name="description" content="Qazi Forex Tips – forex and Gold (XAUUSD) education in Urdu: price action, risk and money management, YouTube lessons and MT5 tools like the QFT Replay Simulator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Nastaliq+Urdu:wght@600&display=swap">
<style>
/* Layout: a teacher's desk — maroon brand band on top, then clear shelves (tools, videos, topics), gold only where you can click */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --ink:#1b1c22; --muted:#5f6370; --rule:#e2ddd6;
  --brand:#8a1c2b; --brand-ink:#ffffff; --gold:#c9971f; --gold-ink:#1d1606;
  --chip:#f1e7e8; --chip-ink:#7a1a27;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1a1d24; --ink:#eceef3; --muted:#a2a8b6; --rule:#2b303a;
  --brand:#6e1522; --brand-ink:#ffffff; --gold:#e0b440; --gold-ink:#1d1606; --chip:#2a1b1f; --chip-ink:#f0b8c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d24; --ink:#eceef3; --muted:#a2a8b6; --rule:#2b303a;
  --brand:#6e1522; --brand-ink:#ffffff; --gold:#e0b440; --gold-ink:#1d1606; --chip:#2a1b1f; --chip-ink:#f0b8c0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.02;text-wrap:balance;margin:0;text-transform:uppercase}
h2{font-size:clamp(32px,4.6vw,48px)}
h3{font-size:24px;font-weight:600;letter-spacing:.4px}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block;height:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1 var(--f-body);text-decoration:none;border-radius:6px;padding:13px 20px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{padding:9px 14px;font-size:14px}
.label{font:600 12px/1 var(--f-mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}

/* header + hero share the maroon band */
.band{background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.brand b{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.5px}
.nav{display:flex;gap:20px;font-weight:600;font-size:15px}
.nav a{text-decoration:none;opacity:.85}.nav a:hover{opacity:1}
@media (max-width:760px){.nav{display:none}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:46px 56px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(42px,6.2vw,76px);overflow-wrap:anywhere}
.hero .ur{font-family:var(--f-ur);direction:rtl;font-size:24px;line-height:2.2;margin-top:8px}
.hero .txt{font-size:19px;opacity:.9;max-width:34em;margin-top:6px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.hero .cta .btn:not(.gold){background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.45)}
.feature{background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.feature img{border-radius:6px}
.feature .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px 2px}
.feature .cap b{font:800 22px/1 var(--f-display);text-transform:uppercase}

section{padding-block:64px;border-bottom:1px solid var(--rule)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.head p{color:var(--muted);max-width:34em}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tool{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.tool .pic{aspect-ratio:16/9;background:var(--chip);display:grid;place-items:center;overflow:hidden}
.tool .pic img{width:100%;height:100%;object-fit:cover}
.tool .pic span{font:800 54px/1 var(--f-display);color:var(--chip-ink);letter-spacing:2px}
.tool .body{padding:18px;display:grid;gap:10px;align-content:start}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:600 12px/1 var(--f-mono);padding:5px 8px;border-radius:4px;background:var(--chip);color:var(--chip-ink);letter-spacing:.5px}
.tag.new{background:var(--gold);color:var(--gold-ink)}
.tool p{color:var(--muted);font-size:16px}
.tool ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.tool li::before{content:"\25B8  ";color:var(--brand)}
.tool .btn{margin-top:6px;justify-self:start}

/* videos */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{font:600 14px/1 var(--f-body);padding:9px 14px;border-radius:20px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.vid{text-decoration:none;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:grid}
.vid .th{aspect-ratio:16/9;background:var(--brand);position:relative;display:grid;place-items:center}
.vid .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .th::after{content:"";width:0;height:0;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;position:relative;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.vid .t{padding:12px 14px;display:grid;gap:6px;font-weight:700;line-height:1.3}
.empty{grid-column:1/-1;border:1px dashed var(--rule);border-radius:10px;padding:28px;color:var(--muted);display:grid;gap:12px;justify-items:start}

/* topics */
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
@media (max-width:900px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.topics{grid-template-columns:1fr}}
.topic{background:var(--surface);padding:22px;display:grid;gap:8px;align-content:start}
.topic h3{color:var(--brand)}
:root[data-theme="dark"] .topic h3{color:var(--chip-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topic h3{color:var(--chip-ink)}}
.topic p{color:var(--muted);font-size:16px}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:32px}
@media (max-width:820px){.contact{grid-template-columns:1fr;padding:22px}}
.num{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.num code{font:600 26px/1 var(--f-mono);color:var(--brand);user-select:all}
:root[data-theme="dark"] .num code{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num code{color:var(--gold)}}
.links{display:grid;gap:10px}
footer{padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:grid;gap:6px}
</style>
</head>
<body>


<div class="band">
  <header class="top"><div class="wrap">
    <a class="brand" href="#home"><img src="logo.png" alt="Qazi Forex Tips logo"><b id="bname">Qazi Forex Tips</b></a>
    <nav class="nav" aria-label="Sections"><a href="#tools">Tools</a><a href="#videos">Videos</a><a href="#learn">Learn</a><a href="#contact">Contact</a></nav>
    <a class="btn gold sm" id="waTop" href="#contact" target="_blank" rel="noopener">WhatsApp</a>
  </div></header>
  <div class="hero" id="home"><div class="wrap">
    <div>
      <div class="label" style="color:rgba(255,255,255,.75)" id="tagline"></div>
      <h1 id="htitle" style="margin-top:12px"></h1>
      <p class="ur" id="hurdu"></p>
      <p class="txt" id="htext"></p>
      <div class="cta" id="hcta"></div>
    </div>
    <div class="feature" id="hfeature"></div>
  </div></div>
</div>

<main>
<section id="tools"><div class="wrap">
  <div class="head"><div><div class="label">Software · EA · Indicators</div><h2 style="margin-top:8px">Trading tools</h2></div>
  <p>Tools built for MetaTrader 5 and used in our own teaching.</p></div>
  <div class="tools" id="toolList"></div>
</div></section>

<section id="videos"><div class="wrap">
  <div class="head"><div><div class="label">YouTube</div><h2 style="margin-top:8px">Latest lessons</h2></div>
  <a class="btn" id="ytBtn" target="_blank" rel="noopener" hidden>Open the channel</a></div>
  <div class="filters" id="filters" role="group" aria-label="Filter videos by topic"></div>
  <div class="vids" id="vidList"></div>
</div></section>

<section id="learn"><div class="wrap">
  <div class="head"><div><div class="label">What we teach</div><h2 style="margin-top:8px">Learn the right way</h2></div></div>
  <div class="topics" id="topicList"></div>
</div></section>

<section id="contact" style="border-bottom:0"><div class="wrap">
  <div class="contact">
    <div>
      <div class="label">Contact</div>
      <h2 style="margin-top:8px">Licenses, demos and questions</h2>
      <div class="num"><code id="waNum"></code><button class="btn sm" id="copy" type="button">Copy number</button><span id="ok" class="label" style="color:var(--brand)" hidden>Copied</span></div>
    </div>
    <div class="links" id="links"></div>
  </div>
</div></section>
</main>

<footer><div class="wrap"><span id="fname"></span><span id="disc"></span></div></footer>

<script src="content.js"></script>
<script>
(function(){
  var S = window.SITE || {}, B = S.brand || {}, H = S.hero || {};
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var wa = "https://wa.me/" + String(B.whatsapp || "").replace(/\D/g, "");
  var $ = function(id){ return document.getElementById(id); };

  $("bname").textContent = B.name || "Qazi Forex Tips";
  $("tagline").textContent = B.tagline || "";
  $("htitle").textContent = H.title || "";
  $("hurdu").textContent = H.urdu || "";
  $("htext").textContent = H.text || "";
  $("waTop").href = wa;
  $("hcta").innerHTML = '<a class="btn gold" href="' + wa + '" target="_blank" rel="noopener">Chat on WhatsApp</a><a class="btn" href="#tools">Our tools</a>';

  var tools = S.tools || [];
  var first = tools.filter(function(t){ return t.image; })[0];
  if (first) $("hfeature").innerHTML = '<img src="' + esc(first.image) + '" alt="' + esc(first.name) + '"><div class="cap"><b>' + esc(first.name) + '</b><a class="btn gold sm" href="' + esc(first.link || wa) + '"' + (first.link ? '' : ' target="_blank" rel="noopener"') + '>' + esc(first.button || "Learn more") + '</a></div>';
  else $("hfeature").hidden = true;

  $("toolList").innerHTML = tools.map(function(t){
    var initials = esc((t.name || "").replace(/^QFT\s*/i, "").split(/\s+/).map(function(w){ return w[0]; }).join("").slice(0, 3));
    var href = t.link || wa, ext = t.link ? "" : ' target="_blank" rel="noopener"';
    return '<article class="tool"><div class="pic">' + (t.image ? '<img src="' + esc(t.image) + '" alt="' + esc(t.name) + '" loading="lazy">' : '<span>' + initials + '</span>') + '</div>' +
      '<div class="body"><div class="tags"><span class="tag">' + esc(t.type) + '</span>' + (t.badge ? '<span class="tag new">' + esc(t.badge) + '</span>' : '') + '</div>' +
      '<h3>' + esc(t.name) + '</h3><p>' + esc(t.text) + '</p>' +
      ((t.points || []).length ? '<ul>' + t.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") + '</ul>' : '') +
      '<a class="btn gold sm" href="' + esc(href) + '"' + ext + '>' + esc(t.button || "Learn more") + '</a></div></article>';
  }).join("");

  var vids = S.videos || [];
  var ytId = function(u){ var m = String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : ""; };
  if (B.youtube) { $("ytBtn").href = B.youtube; $("ytBtn").hidden = false; }
  var topicsV = ["All"].concat(vids.map(function(v){ return v.topic; }).filter(function(t, i, a){ return t && a.indexOf(t) === i; }));
  function drawVids(f){
    var list = vids.filter(function(v){ return f === "All" || v.topic === f; });
    if (!vids.length) {
      $("vidList").innerHTML = '<div class="empty"><b style="color:var(--ink)">New lessons are added here every week.</b><span>Watch all lessons on our YouTube channel.</span>' + (B.youtube ? '<a class="btn gold sm" href="' + esc(B.youtube) + '" target="_blank" rel="noopener">Open YouTube</a>' : '') + '</div>';
      return;
    }
    $("vidList").innerHTML = list.map(function(v){
      var id = ytId(v.link);
      return '<a class="vid" href="' + esc(v.link) + '" target="_blank" rel="noopener"><div class="th">' + (id ? '<img src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div><div class="t">' + (v.topic ? '<span class="tag" style="justify-self:start">' + esc(v.topic) + '</span>' : '') + esc(v.title) + '</div></a>';
    }).join("");
  }
  if (topicsV.length > 2) {
    $("filters").innerHTML = topicsV.map(function(t, i){ return '<button type="button" aria-pressed="' + (i === 0) + '">' + esc(t) + '</button>'; }).join("");
    $("filters").addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      [].forEach.call(this.children, function(x){ x.setAttribute("aria-pressed", x === b); });
      drawVids(b.textContent);
    });
  } else $("filters").hidden = true;
  drawVids("All");

  $("topicList").innerHTML = (S.topics || []).map(function(t){ return '<div class="topic"><h3>' + esc(t.name) + '</h3><p>' + esc(t.text) + '</p></div>'; }).join("");

  $("waNum").textContent = B.whatsapp || "";
  var links = '<a class="btn gold" href="' + wa + '" target="_blank" rel="noopener">Chat on WhatsApp</a>';
  if (B.youtube) links += '<a class="btn" href="' + esc(B.youtube) + '" target="_blank" rel="noopener">YouTube channel</a>';
  if (B.facebook) links += '<a class="btn" href="' + esc(B.facebook) + '" target="_blank" rel="noopener">Facebook group</a>';
  if (B.email) links += '<span class="label" style="text-transform:none;letter-spacing:0;font-size:15px">' + esc(B.email) + '</span>';
  $("links").innerHTML = links;
  $("copy").addEventListener("click", async function(){
    try { await navigator.clipboard.writeText(B.whatsapp || ""); $("ok").hidden = false; setTimeout(function(){ $("ok").hidden = true; }, 1800); }
    catch (e) { var r = document.createRange(); r.selectNodeContents($("waNum")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });

  $("fname").textContent = "© " + new Date().getFullYear() + " " + (B.name || "") + " · WhatsApp " + (B.whatsapp || "");
  $("disc").textContent = S.disclaimer || "";
})();
</script>

</body>
</html>
