name: Site theme
# Keeps the default light theme (Brand Maroon & Gold) on every page, including pages made later by any builder.
on:
  push:
    branches: [main]
    paths: ["**.html", ".github/scripts/apply-theme.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-theme
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the theme
        run: python3 .github/scripts/apply-theme.py
      - name: Commit
        run: |
          git config user.name "qft-theme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo "theme already applied"; exit 0; fi
          git commit -m "Apply site theme to new pages"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
