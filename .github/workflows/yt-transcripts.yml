name: YouTube transcripts (free, for QFT Video Brain)
on:
  push:
    branches: [yt-transcripts]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    if: github.ref == 'refs/heads/yt-transcripts'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: List videos
        run: |
          mkdir -p transcripts
          yt-dlp --flat-playlist --print "%(id)s	%(title)s" "https://www.youtube.com/@QaziForexTips/videos" > transcripts/videos.tsv || true
          wc -l transcripts/videos.tsv
      - name: Download captions only (no video)
        run: |
          yt-dlp --skip-download --write-subs --write-auto-subs --sub-langs "en,en-orig,ur,ur-orig,hi" --sub-format json3 \
            --sleep-requests 1 --sleep-subtitles 2 --ignore-errors -o "transcripts/%(id)s.%(ext)s" \
            "https://www.youtube.com/@QaziForexTips/videos" 2>&1 | tail -40 || true
          ls transcripts | head; echo "files: $(ls transcripts | wc -l)"
      - name: Save to this branch
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add transcripts
          git commit -m "Update video transcripts" || echo "nothing new"
          git push origin HEAD:yt-transcripts
