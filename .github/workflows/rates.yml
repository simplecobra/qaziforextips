name: Live gold rates - write into the site
# Every 30 minutes: fetches the Gold, Silver, USD/PKR and Bitcoin rates and writes them into
# data/*.json, the gold / silver / bitcoin pages and the home-page boxes (see .github/scripts/update-rates.py).
# Uses the TWELVEDATA_KEY repository secret when it is set; without it, free keyless sources are used.
on:
  schedule:
    - cron: "11,41 * * * 1-5"    # every 30 minutes, Monday to Friday (UTC)
    - cron: "17 4 * * 6"         # Saturday morning: write the final Friday close once
  workflow_dispatch:              # "Run workflow" button on GitHub
permissions:
  contents: write
concurrency: live-rates
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch rates and write them into the pages
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python3 .github/scripts/update-rates.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ gold-rate-pakistan.html silver-rate-pakistan.html bitcoin-price-pakistan.html dollar-rate-pakistan.html index.html sitemap.xml
          git commit -m "Update live gold rates (automatic)"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::notice::main kept changing; the next run will write the rates."
